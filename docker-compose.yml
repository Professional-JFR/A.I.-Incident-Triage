services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_triage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-incident_triage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_triage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      RECENT_INCIDENT_LIMIT: ${RECENT_INCIDENT_LIMIT:-50}
      STARTUP_DB_RETRIES: ${STARTUP_DB_RETRIES:-20}
      STARTUP_DB_RETRY_DELAY_SECONDS: ${STARTUP_DB_RETRY_DELAY_SECONDS:-1.5}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-5}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      TRIAGE_PROVIDER: ${TRIAGE_PROVIDER:-rules}
      TRIAGE_LLM_ENDPOINT: ${TRIAGE_LLM_ENDPOINT:-}
      TRIAGE_LLM_API_KEY: ${TRIAGE_LLM_API_KEY:-}
      TRIAGE_LLM_MODEL: ${TRIAGE_LLM_MODEL:-incident-triage}
      TRIAGE_LLM_TIMEOUT_SECONDS: ${TRIAGE_LLM_TIMEOUT_SECONDS:-5}
      TRIAGE_LLM_RETRIES: ${TRIAGE_LLM_RETRIES:-2}
      TRIAGE_LLM_RETRY_DELAY_SECONDS: ${TRIAGE_LLM_RETRY_DELAY_SECONDS:-0.25}
      API_KEY_AUTH_ENABLED: ${API_KEY_AUTH_ENABLED:-false}
      API_KEY: ${API_KEY:-}
      AUTH_PROTECT_PUBLIC_ENDPOINTS: ${AUTH_PROTECT_PUBLIC_ENDPOINTS:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
